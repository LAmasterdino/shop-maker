<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f5">
  <title>Shop erstellen</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f7f5;
      color: #202b25;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 440px;
      padding: 40px;
      background: #fff;
      border: 1px solid #edf0ed;
      border-radius: 22px;
      box-shadow: 0 14px 45px rgba(24, 41, 29, .07);
    }
    .icon {
      width: 48px; height: 48px;
      display: grid; place-items: center;
      border-radius: 14px;
      background: #e9f6ed; color: #25834b;
      font-size: 24px;
    }
    h1 { margin: 24px 0 8px; font-size: 26px; letter-spacing: -1px; }
    .intro { margin: 0; color: #78837c; font-size: 14px; line-height: 1.6; }
    label { display: block; margin: 28px 0 9px; font-size: 14px; font-weight: 650; }
    input {
      width: 100%; padding: 15px;
      border: 1px solid #dfe5e0; border-radius: 11px;
      background: #fff; color: #202b25; font-size: 15px;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: #31965a; box-shadow: 0 0 0 3px rgba(49,150,90,.12); }
    button {
      width: 100%; margin-top: 16px; padding: 15px;
      border: 0; border-radius: 11px;
      background: #27864c; color: white;
      font-size: 15px; font-weight: 650; cursor: pointer;
      transition: background .15s, transform .15s;
    }
    button:hover:not(:disabled) { background: #207441; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .65; cursor: wait; }
    #status {
      display: none; margin-top: 18px; padding: 13px;
      border-radius: 10px; font-size: 14px; line-height: 1.5;
      overflow-wrap: anywhere;
    }
    #status.success { display: block; background: #e9f7ed; color: #237340; }
    #status.error { display: block; background: #fff0ef; color: #b83232; }
    .notice {
      margin-top: 24px; padding-top: 18px;
      border-top: 1px solid #edf0ed;
      color: #929b95; font-size: 12px; line-height: 1.55;
    }
    @media (max-width: 480px) { .card { padding: 28px 22px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">✦</div>
    <h1>Shop erstellen</h1>
    <p class="intro">Trage einen Shop-Namen ein. Er wird als Kanal für deinen Shop festgelegt.</p>

    <form id="shopForm">
      <label for="shop">Shop-Name</label>
      <input id="shop" name="shop" type="text"
             placeholder="z. B. Mein Lieblingsshop"
             maxlength="100" autocomplete="off" required>
      <button id="send" type="submit">Senden <span aria-hidden="true">→</span></button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <div class="notice">
      ℹ️ Der Shop wird nach senden sofort erstellt. Es kann einige Sekunden dauern, bis der Server auf Disord sichtbar ist.
    </div>
  </main>

  <script>
    // Hier das feste ntfy-Topic eintragen:
    const NTFY_TOPIC = "n8n_ntfy_key_srvr_wlwlk3kgjguw7w93otkgkdkq729zpwkflclewl2progiei";

    // Optional: Bei eigenem ntfy-Server diese URL anpassen.
    const NTFY_SERVER = "https://ntfy.sh";

    const form = document.getElementById("shopForm");
    const input = document.getElementById("shop");
    const button = document.getElementById("send");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const shop = input.value.trim();
      if (!shop) {
        input.focus();
        return;
      }

      if (!NTFY_TOPIC || NTFY_TOPIC === "mein-festes-topic") {
        status.className = "error";
        status.textContent = "Bitte zuerst im HTML-Code den festen ntfy-Topic-Namen eintragen.";
        return;
      }

      button.disabled = true;
      button.textContent = "Wird gesendet …";
      status.className = "";
      status.textContent = "";

      try {
        const response = await fetch(
          `${NTFY_SERVER.replace(/\/$/, "")}/${encodeURIComponent(NTFY_TOPIC)}`,
          {
            method: "POST",
            headers: {
              "Content-Type": "text/plain; charset=utf-8",
              "Title": "Shop-Benachrichtigung"
            },
            body: shop
          }
        );

        if (!response.ok) {
          throw new Error(`ntfy antwortete mit HTTP ${response.status}`);
        }

        status.className = "success";
        status.textContent = `✓ Erfolgreich gesendet: „${shop}“`;
        input.value = "";
      } catch (error) {
        status.className = "error";
        status.textContent = "Senden fehlgeschlagen. Bitte Internetverbindung und ntfy-Topic prüfen. " + error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Senden →";
      }
    });
  </script>
</body>
</html>
